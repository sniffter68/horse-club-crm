name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pinned Prisma Linux engines
        working-directory: horse-club-crm
        env:
          PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x
        run: |
          npm --prefix backend ci --ignore-scripts
          node backend/node_modules/@prisma/engines/scripts/postinstall.js
          mkdir -p .deploy/prisma
          cp backend/node_modules/@prisma/engines/libquery_engine-debian-openssl-3.0.x.so.node .deploy/prisma/
          cp backend/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x .deploy/prisma/
          chmod +x .deploy/prisma/schema-engine-debian-openssl-3.0.x
          (cd .deploy/prisma && sha256sum * > SHA256SUMS)
      - name: Upload Prisma engines to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: horse-club-crm/.deploy/prisma
          strip_components: 1
          target: /opt/horse-club-crm/horse-club-crm
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            bash -se <<'DEPLOY'
            set -Eeuo pipefail
            export TZ=Europe/Moscow
            trap 'status=$?; printf "Deployment failed: %s - commit %s - workflow line %s - command: %s - exit %s\n" "$(date --iso-8601=seconds)" "${deploy_commit:-unknown}" "$LINENO" "$BASH_COMMAND" "$status" >&2; exit "$status"' ERR
            echo "Deployment started: $(date --iso-8601=seconds)"
            cd /opt/horse-club-crm/horse-club-crm
            (cd .deploy/prisma && sha256sum -c SHA256SUMS)
            git pull --ff-only origin main
            deploy_commit=$(git rev-parse --short HEAD)
            echo "Deploying commit $deploy_commit"
            chmod +x ./deploy.sh
            ./deploy.sh
            echo "Deployment successful: $(date --iso-8601=seconds) - commit $deploy_commit" >> /opt/horse-club-crm/horse-club-crm/docs/deploy_history.log
            echo "=== ДЕПЛОЙ ЗАВЕРШЕН УСПЕШНО ==="
            echo "CRM: https://crm.horseclub68.ru"
            echo "Landing: https://horseclub68.ru"
            DEPLOY
      - name: Release summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          TRIGGER_COMMIT: ${{ github.sha }}
        run: |
          printf 'Deployment status: %s\nTrigger commit: %s\nDate: %s\n' "$DEPLOY_STATUS" "$TRIGGER_COMMIT" "$(TZ=Europe/Moscow date --iso-8601=seconds)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_STATUS" = success ]; then
            printf '=== ДЕПЛОЙ ЗАВЕРШЕН УСПЕШНО ===\nCRM: https://crm.horseclub68.ru\nLanding: https://horseclub68.ru\n' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
