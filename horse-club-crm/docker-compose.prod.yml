name: horse-crm-prod
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [crm_network]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: build
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [crm_network]
    restart: 'no'
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 bytes}
      CLUB_TIME_ZONE: ${CLUB_TIME_ZONE:-Europe/Moscow}
      VK_BOT_TOKEN: ${VK_BOT_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_CONFIRMATION_CODE: ${VK_CONFIRMATION_CODE:-}
      VK_SECRET_KEY: ${VK_SECRET_KEY:-}
      VK_ADMIN_PEER_ID: ${VK_ADMIN_PEER_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [crm_network]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      LANDING_SITE: ${LANDING_SITE:?Set LANDING_SITE}
      CRM_SITE: ${CRM_SITE:?Set CRM_SITE}
      API_SITE: ${API_SITE:?Set API_SITE}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/var/www/crm-dist:ro
      - ./landing/dist:/var/www/landing-dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }
    networks: [crm_network]
    logging: *logging

networks:
  crm_network:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
